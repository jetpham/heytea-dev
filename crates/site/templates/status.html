<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><title>heytea.dev status</title><meta name="description" content="Service and data freshness status for heytea.dev."><meta name="theme-color" content="#101510"><link rel="canonical" href="https://status.heytea.dev/"><link rel="preload" href="/a.woff2" as="font" type="font/woff2" crossorigin><link rel="icon" href="/icon.svg" type="image/svg+xml">{% for href in assets.css %}<link rel="stylesheet" href="{{ href }}">{% endfor %}</head><body><main><p class="{% if operational %}ok{% else %}bad{% endif %}">{{ summary }}</p><h1>heytea.dev status</h1><section><dl><div><dt>Database</dt><dd>{{ database }}</dd></div><div><dt>Data freshness</dt><dd>{{ freshness }}</dd></div><div><dt>Store open</dt><dd>{{ store_open }}</dd></div><div><dt>Pickup wait</dt><dd class="n">{{ pickup_wait }}</dd></div><div><dt>Checked</dt><dd class="n">{{ checked }}</dd></div></dl></section></main>{% for src in assets.scripts %}<script type="module" src="{{ src }}"></script>{% endfor %}</body></html>
