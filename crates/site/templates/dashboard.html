<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>heytea {{ location_name }}</title>
  <meta name="description" content="Live wait time for heytea {{ location_name }}.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="heytea.dev">
  <meta property="og:description" content="{{ status_line }}">
  <meta property="og:image" content="https://heytea.dev/og.svg">
  <meta property="og:image:type" content="image/svg+xml">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="heytea.dev">
  <meta name="twitter:description" content="{{ status_line }}">
  <meta name="twitter:image" content="https://heytea.dev/og.svg">
  <link rel="canonical" href="{{ canonical_url }}">
  <link rel="icon" href="{{ favicon_href }}" type="image/svg+xml">
  <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt">
  <style>{{ inline_css|safe }}</style>
</head>
<body>
  <nav aria-label="main">
    <a class="brand" href="https://heytea.dev/">heytea.dev</a>
    <span class="links">
      <a href="https://docs.heytea.dev/">docs</a>
      <a href="https://status.heytea.dev/">status</a>
      <a href="https://crates.io/crates/heytea">crate</a>
      <a href="https://mcp.heytea.dev/mcp">mcp</a>
    </span>
  </nav>
  <main id="app" data-stream-url="{{ stream_url }}" data-location-name="{{ location_name }}" data-timezone="{{ timezone }}" data-open="{{ open }}" data-wait="{{ wait_minutes }}" data-observed-at="{{ observed_at }}">
    <p id="status" aria-live="polite">{{ status_line }}</p>
    <svg id="graph" viewBox="0 0 100 40" preserveAspectRatio="none" aria-label="pickup wait history" role="img"{% if closed %} hidden{% endif %}>
      <polyline id="trend" data-v="{{ trend_data }}" data-m="{{ trend_minute }}" points="{{ trend_points }}"></polyline>
    </svg>
  </main>
  <footer>
    <span>made by <a href="https://jetpham.com">jet</a></span>
    {% if evil %}<span class="evil">i know you're evil</span>{% else %}<span class="evil" aria-hidden="true"></span>{% endif %}
    <a class="source" href="https://github.com/jetpham/heytea-dev">source code</a>
  </footer>
  <script>{{ inline_js|safe }}</script>
</body>
</html>
