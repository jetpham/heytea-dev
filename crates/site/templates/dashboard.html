<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>heytea.dev</title>
  <meta name="description" content="Live wait time for HeyTea Downtown Metreon.">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://heytea.dev/">
  <link rel="icon" href="{{ favicon_href }}" type="image/svg+xml">
  <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt">
  <style>{{ inline_css|safe }}</style>
</head>
<body>
  <main id="app" data-stream-url="{{ stream_url }}">
    <table class="header" aria-label="Page header">
      <tr>
        <th>APP</th>
        <td>heytea.dev</td>
        <th>MODE</th>
        <td>live</td>
      </tr>
      <tr>
        <th>STORE</th>
        <td>Downtown Metreon</td>
        <th>SIGNAL</th>
        <td>pickup</td>
      </tr>
    </table>

    <section aria-labelledby="current-title">
      <p id="current-title" class="label">CURRENT</p>
      <table aria-label="Current pickup status">
        <tr>
          <th>Pickup</th>
          <td id="w">{{ pickup_wait }}</td>
        </tr>
        <tr>
          <th>Cups</th>
          <td id="c">{{ making_cups }}</td>
        </tr>
        <tr>
          <th>Orders</th>
          <td id="o">{{ making_orders }}</td>
        </tr>
      </table>
    </section>

    <section aria-labelledby="store-title">
      <p id="store-title" class="label">STORE</p>
      <table aria-label="Store status">
        <tr>
          <th>Observed</th>
          <td id="obs">{{ observed }}</td>
        </tr>
        <tr>
          <th>Open</th>
          <td id="open">{{ open }}</td>
        </tr>
        <tr>
          <th>Closing</th>
          <td id="closing">{{ closing_notice }}</td>
        </tr>
      </table>
    </section>

    <section aria-labelledby="history-title">
      <p id="history-title" class="label">PICKUP HISTORY</p>
      <svg class="sparkline" viewBox="0 0 100 40" preserveAspectRatio="none" aria-label="Pickup wait trend" role="img">
        <polyline id="trend" data-v="{{ trend_data }}" data-m="{{ trend_minute }}" points="{{ trend_points }}"></polyline>
      </svg>
    </section>
  </main>
  <script>{{ inline_js|safe }}</script>
</body>
</html>
