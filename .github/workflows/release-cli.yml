name: Release CLI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing or new release tag, such as v0.1.1. Defaults to the CLI package version.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.event.workflow_run.head_sha || github.event.inputs.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  release-cli:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h
      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            tag="${{ github.event.inputs.tag_name }}"
            version="${tag#v}"
          else
            version=$(nix develop --accept-flake-config -c sh -c 'cargo metadata --no-deps --format-version=1 | jq -r '\''.packages[] | select(.name == "heytea-cli") | .version'\''')
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check existing release
        id: existing
        run: |
          if gh release view "${{ steps.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.release.outputs.tag }} already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build CLI package
        if: ${{ steps.existing.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        run: nix --accept-flake-config build .#heytea-cli --out-link result-heytea-cli
      - name: Package CLI binary
        if: ${{ steps.existing.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          package="heytea-${version}-x86_64-linux"
          mkdir -p "dist/$package"
          cp -L result-heytea-cli/bin/heytea "dist/$package/heytea"
          chmod 0755 "dist/$package/heytea"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > SHA256SUMS)
      - name: Upload workflow artifact
        if: ${{ steps.existing.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: heytea-cli-${{ steps.release.outputs.tag }}-x86_64-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Ensure release exists
        if: ${{ steps.existing.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          target=$(git rev-parse HEAD)
          gh release view "${{ steps.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" || gh release create "${{ steps.release.outputs.tag }}" --target "$target" --title "${{ steps.release.outputs.tag }}" --notes "heytea CLI ${{ steps.release.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload release assets
        if: ${{ steps.existing.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        run: gh release upload "${{ steps.release.outputs.tag }}" dist/*.tar.gz dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
