name: Deploy

on:
  workflow_dispatch:
    inputs:
      origin_ipv4:
        description: Origin IPv4 for Cloudflare DNS cutover. Defaults to the current apex A record.
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h
      - name: Configure Cloudflare proxy
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ORIGIN_IPV4: ${{ github.event.inputs.origin_ipv4 || '' }}
        run: |
          nix develop --accept-flake-config -c bash -s <<'SCRIPT'
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is required for production deploys" >&2
            exit 1
          fi

          api_base=https://api.cloudflare.com/client/v4
          zone_name=heytea.dev
          auth_header=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --header "Content-Type: application/json")

          zone_id=$(curl -fsS -G "${auth_header[@]}" --data-urlencode "name=${zone_name}" "${api_base}/zones" | jq -er '.result[0].id')
          current_origin_ipv4=$(curl -fsS -G "${auth_header[@]}" --data-urlencode "type=A" --data-urlencode "name=${zone_name}" "${api_base}/zones/${zone_id}/dns_records" | jq -er '.result[0].content')
          origin_ipv4=${ORIGIN_IPV4:-$current_origin_ipv4}

          upsert_a_record() {
            local name=$1
            local proxied=$2
            local record_id body method url
            record_id=$(curl -fsS -G "${auth_header[@]}" --data-urlencode "type=A" --data-urlencode "name=${name}" "${api_base}/zones/${zone_id}/dns_records" | jq -r '.result[0].id // empty')
            body=$(jq -n --arg name "${name}" --arg content "${origin_ipv4}" --argjson proxied "${proxied}" '{type:"A", name:$name, content:$content, ttl:1, proxied:$proxied}')
            if [ -n "${record_id}" ]; then
              method=PUT
              url="${api_base}/zones/${zone_id}/dns_records/${record_id}"
            else
              method=POST
              url="${api_base}/zones/${zone_id}/dns_records"
            fi
            curl -fsS -X "${method}" "${auth_header[@]}" --data "${body}" "${url}" | jq -e '.success == true' >/dev/null
          }

          for host in heytea.dev api.heytea.dev docs.heytea.dev mcp.heytea.dev status.heytea.dev; do
            upsert_a_record "${host}" true
          done
          upsert_a_record ssh.heytea.dev false

          curl -fsS -X PATCH "${auth_header[@]}" --data '{"value":"full"}' "${api_base}/zones/${zone_id}/settings/ssl" | jq -e '.success == true' >/dev/null
          echo "origin_ipv4=${origin_ipv4}" >> "${GITHUB_OUTPUT}"
          SCRIPT
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Configure SSH
        id: ssh
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          probe() {
            ssh -p "$1" \
              -o BatchMode=yes \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=accept-new \
              root@heytea-dev-2 'printf deploy-ready' 2>/dev/null || true
          }

          if [ "$(probe 2222)" = deploy-ready ]; then
            port=2222
          elif [ "$(probe 22)" = deploy-ready ]; then
            port=22
          else
            echo "could not reach admin OpenSSH on heytea-dev-2 port 2222 or bootstrap port 22" >&2
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host heytea-dev-2
            User root
            Port $port
            StrictHostKeyChecking accept-new
          EOF
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Deploy NixOS
        run: |
          set -euo pipefail

          deploy_args=(--ssh-opts "-p ${{ steps.ssh.outputs.port }}")
          if [ "${{ steps.ssh.outputs.port }}" = "22" ]; then
            deploy_args+=(--magic-rollback false)
          fi

          nix develop --accept-flake-config -c deploy "${deploy_args[@]}" .#heytea-dev
      - name: Verify deployment
        run: |
          set -euo pipefail

          ssh heytea-dev-2 'set -euo pipefail
            curl -fsS -H "X-Forwarded-For: 8.8.8.8" http://127.0.0.1:3100/ -o /tmp/heytea-geoip-check.html
            grep -q "server location guess: Mountain View" /tmp/heytea-geoip-check.html
            grep -q "data-search=\"sunnyvale" /tmp/heytea-geoip-check.html
          '

          headers=$(mktemp)
          curl -fsS https://heytea.dev/ -D "$headers" -o /dev/null
          grep -qi '^cf-ray:' "$headers"

          if curl -kfsS --connect-timeout 8 --resolve "heytea.dev:443:${{ steps.cloudflare.outputs.origin_ipv4 }}" https://heytea.dev/ -o /dev/null; then
            echo "direct origin HTTPS unexpectedly succeeded" >&2
            exit 1
          fi
