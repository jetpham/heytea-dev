name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Configure SSH
        id: ssh
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          probe() {
            ssh -p "$1" \
              -o BatchMode=yes \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=accept-new \
              root@heytea-dev 'printf deploy-ready' 2>/dev/null || true
          }

          if [ "$(probe 2222)" = deploy-ready ]; then
            port=2222
          elif [ "$(probe 22)" = deploy-ready ]; then
            port=22
          else
            echo "could not reach admin OpenSSH on heytea-dev port 2222 or bootstrap port 22" >&2
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host heytea-dev
            User root
            Port $port
            StrictHostKeyChecking accept-new
          EOF
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - name: Deploy NixOS
        run: nix develop --accept-flake-config -c deploy --ssh-opts "-p ${{ steps.ssh.outputs.port }}" .#heytea-dev
