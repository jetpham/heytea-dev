name: Publish Crate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run cargo publish --dry-run only
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: publish-crate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | if . == null then "missing" elif .status == "completed" then .conclusion else .status end')
            case "$state" in
              success)
                exit 0
                ;;
              missing|queued|in_progress|requested|waiting|pending)
                sleep 30
                ;;
              *)
                echo "CI did not succeed for $GITHUB_SHA: $state"
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for CI to complete for $GITHUB_SHA"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Read SDK version
        id: version
        run: |
          version=$(nix develop --accept-flake-config -c sh -c 'cargo metadata --no-deps --format-version=1 | jq -r '\''.packages[] | select(.name == "heytea") | .version'\''')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check crates.io version
        id: published
        run: |
          set -euo pipefail
          published=$(curl -fsS -H 'User-Agent: jetpham/heytea-dev publish workflow' https://crates.io/api/v1/crates/heytea | jq -r --arg version "${{ steps.version.outputs.version }}" 'any(.versions[]?; .num == $version)')
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ "$published" = true ]; then
            echo "heytea ${{ steps.version.outputs.version }} is already published"
          fi
      - name: Verify package
        if: ${{ steps.published.outputs.published != 'true' }}
        run: nix develop --accept-flake-config -c cargo publish -p heytea --dry-run --locked
      - name: Authenticate with crates.io
        id: auth
        if: ${{ steps.published.outputs.published != 'true' && (github.event_name == 'push' || github.event.inputs.dry_run == 'false') }}
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: ${{ steps.published.outputs.published != 'true' && (github.event_name == 'push' || github.event.inputs.dry_run == 'false') }}
        run: nix develop --accept-flake-config -c cargo publish -p heytea --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
