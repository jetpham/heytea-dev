name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix flake check
        run: nix flake check --no-build
      - name: Rust check
        run: nix develop -c cargo check --workspace
      - name: Site build
        run: nix develop -c pnpm install --frozen-lockfile && nix develop -c pnpm build
      - name: Build packages
        run: nix build .#heytea-api .#heytea-poller .#heytea-mcp .#heytea-cli .#heytea-assets .#heytea-site-assets .#heytea-site .#heytea-migrations --no-link
      - name: OpenTofu validate
        run: nix develop -c sh -c 'cd infra/opentofu && tofu init -backend=false && tofu validate'
