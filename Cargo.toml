[workspace]
resolver = "2"
members = [
  "crates/api",
  "crates/cli",
  "crates/core",
  "crates/mcp",
  "crates/poller",
  "crates/sdk",
  "crates/site",
  "crates/ssh-tui",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/jetpham/heytea-dev"
authors = ["Jet Pham"]

[workspace.dependencies]
anyhow = "1"
askama = "0.12"
async-stream = "0.3"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
maxminddb = "0.24"
russh = { version = "0.60", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid", "migrate", "macros"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["time"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-scalar = { version = "0.2", features = ["axum"] }
url = "2"
